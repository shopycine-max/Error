name: Automated Market Scanner & Alert Engine

on:
  schedule:
    # सोम-शुक्र: बाज़ार समय (IST 9:15 AM से 3:30 PM के बीच)
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: # मैनुअल रन बटन के लिए

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; me pip install -r requirements.txt; fi

      - name: Run Headless Scanner
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python app.py --headless
