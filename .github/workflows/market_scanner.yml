name: Automated Market Scanner & Alert Engine

on:
  schedule:
    # IST: Subah 8:00 AM se Shaam 4:00 PM (Mon-Fri)
    # UTC Timing: 2:30 AM UTC se 10:30 AM UTC
    - cron: '30-59/5 2 * * 1-5'  # 8:00 AM IST se 8:25 AM IST
    - cron: '*/5 3-9 * * 1-5'     # 8:30 AM IST se 3:25 PM IST
    - cron: '0-30/5 10 * * 1-5'   # 3:30 PM IST se 4:00 PM IST
  workflow_dispatch: # Manual run ka option

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    permissions:
      contents: write # sent_alerts.json commit & push karne ke liye write access

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else 
            pip install pandas requests yfinance streamlit plotly
          fi

      - name: Run Headless Scanner
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python app.py --headless

      - name: Commit and Push sent_alerts.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_alerts.json || true
          git diff --staged --quiet || (git commit -m "Chore: Update sent_alerts.json [skip ci]" && git push)
