name: Automated Market Scanner & Alert Engine

on:
  schedule:
    # Timing in UTC: 3:30 AM UTC se 10:00 AM UTC (IST: 9:00 AM se 3:30 PM)
    # Mon-Fri (1-5) har 15 minute me automatic run hoga (GitHub Actions ke liye stable timing)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Manual run ka option

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    permissions:
      contents: write # sent_alerts.json commit & push karne ke liye write access

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else 
            pip install pandas requests yfinance streamlit plotly
          fi

      - name: Run Headless Scanner
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python app.py --headless

      - name: Commit and Push sent_alerts.json (Duplicate Email Protection)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          if [ -f sent_alerts.json ]; then
            git add sent_alerts.json
            git commit -m "Update sent alerts log [skip ci]" || echo "No changes to commit"
            git push origin main || echo "Git push failed"
          fi
