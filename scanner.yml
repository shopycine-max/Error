name: Stock Breakout Scanner Cron

on:
  schedule:
    # Mon-Fri every 30 mins between 9:15 AM to 3:30 PM IST (03:45 UTC to 10:00 UTC)
    - cron: '*/30 3-9 * * 1-5'
  workflow_dispatch: # Manual trigger button on GitHub

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Execute Scanner Script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python cloud_scanner.py
